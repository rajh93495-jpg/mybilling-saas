<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MyBilling - Dashboard</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f3f5f9;color:#172033}
header{background:#172554;color:white;padding:20px}
header h2{margin:0}
header p{margin:6px 0 0;color:#bfdbfe}
main{padding:16px;max-width:850px;margin:auto}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card,.panel{background:white;padding:18px;border-radius:13px;margin-bottom:14px;box-shadow:0 2px 8px #0000000b}
.card p{color:#64748b;margin:0}
.card h2{margin:10px 0 0;color:#1d4ed8}
.panel h3{margin-top:0}
input{width:100%;padding:13px;margin:7px 0 12px;border:1px solid #cbd5e1;border-radius:8px;font-size:16px}
button{background:#2563eb;color:white;border:0;border-radius:8px;padding:13px 18px;font-size:15px;font-weight:bold;cursor:pointer}
button:active{opacity:.8}
.item{padding:12px 0;border-bottom:1px solid #e2e8f0;display:flex;justify-content:space-between;gap:8px}
.small{color:#64748b;font-size:13px}
</style>
</head>
<body>
<header>
<h2>MyBilling</h2>
<p>Billing Management Software</p>
</header>

<main>
<div class="cards">
<div class="card">
<p>Total Sales</p>
<h2 id="sales">₹0</h2>
</div>
<div class="card">
<p>Total Bills</p>
<h2 id="count">0</h2>
</div>
</div>

<div class="panel">
<h3>Create New Bill</h3>
<label>Customer Name</label>
<input id="customer" placeholder="Enter customer name">
<label>Bill Amount (₹)</label>
<input id="amount" type="number" min="0.01" step="0.01" placeholder="Enter amount">
<button onclick="addBill()">Create Bill</button>
<p class="small" id="message"></p>
</div>

<div class="panel">
<h3>Recent Bills</h3>
<div id="bills">No bills created yet.</div>
</div>
</main>

<script>
let bills = JSON.parse(localStorage.getItem("mybilling_bills") || "[]");

function render(){
 let total = bills.reduce((sum,b)=>sum+b.amount,0);
 document.getElementById("sales").textContent =
 "₹"+total.toLocaleString("en-IN",{maximumFractionDigits:2});
 document.getElementById("count").textContent=bills.length;

 let area=document.getElementById("bills");
 if(!bills.length){
   area.textContent="No bills created yet.";
   return;
 }
 area.innerHTML="";
 bills.slice().reverse().forEach(b=>{
   let div=document.createElement("div");
   div.className="item";
   let left=document.createElement("span");
   left.textContent=b.customer+" • "+b.date;
   let right=document.createElement("strong");
   right.textContent="₹"+b.amount.toLocaleString("en-IN");
   div.append(left,right);
   area.appendChild(div);
 });
}

function addBill(){
 let customer=document.getElementById("customer").value.trim();
 let amount=Number(document.getElementById("amount").value);
 let message=document.getElementById("message");

 if(!customer || !Number.isFinite(amount) || amount<=0){
   message.textContent="Please enter a customer name and valid amount.";
   return;
 }

 bills.push({
   customer:customer,
   amount:amount,
   date:new Date().toLocaleDateString("en-IN")
 });

 localStorage.setItem("mybilling_bills",JSON.stringify(bills));
 document.getElementById("customer").value="";
 document.getElementById("amount").value="";
 message.textContent="Bill created successfully!";
 render();
}

render();
</script>
</body>
</html>
